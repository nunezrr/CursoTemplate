[project]
name = "maintenance-lab"
version = "0.1.0"
description = "Sesión 8 — laboratorio de mantenimiento: mutation testing (cosmic-ray), tests flaky y selectores robustos"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "cosmic-ray>=8.4.6",
    "pytest-rerunfailures>=14.0",
    "playwright>=1.44.0",
    "pytest-playwright>=0.5.0",
]

[tool.pytest.ini_options]
# Solo `tests/` entra en la suite "oficial" (la que corre cosmic-ray).
# Los demos de flaky y healing se corren explícitamente:
#   uv run pytest flaky -v
#   uv run pytest healing -v
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"
