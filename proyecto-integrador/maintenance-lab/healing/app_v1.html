<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tienda — Login (v1)</title>
</head>
<body>
  <!-- VERSIÓN 1 de la página: el "antes" del rediseño. -->
  <!-- El botón tiene un id explícito y una clase de framework. -->
  <main>
    <h1>Ingresar</h1>
    <form>
      <label for="user">Usuario</label>
      <input id="user" name="user" type="text">

      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password">

      <button id="login-btn" class="btn btn-primary" type="button">Ingresar</button>
    </form>
  </main>
</body>
</html>
